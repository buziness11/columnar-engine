<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 934 675" font-family="Inter,-apple-system,system-ui,sans-serif">
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f2f2f"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#A07840"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4A7FB5"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4F8A5E"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="934" height="675" fill="#f8f7f4"/>

  <text x="467" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a" letter-spacing="-0.3">Columnar Engine Architecture</text>
  <text x="467" y="53" text-anchor="middle" font-size="11" fill="#777" letter-spacing="0.4">pull-based engine</text>

  <!-- External endpoints -->
  <rect x="52" y="88" width="128" height="48" rx="8" fill="#ffffff" stroke="#d5d2cc" stroke-width="1" filter="url(#shadow)"/>
  <text x="116" y="107" text-anchor="middle" font-size="10.5" font-weight="600" fill="#444">SQL query</text>
  <text x="116" y="122" text-anchor="middle" font-size="8.5" fill="#777">input request</text>

  <rect x="754" y="88" width="128" height="48" rx="8" fill="#ffffff" stroke="#d5d2cc" stroke-width="1" filter="url(#shadow)"/>
  <text x="818" y="107" text-anchor="middle" font-size="10.5" font-weight="600" fill="#444">Result</text>
  <text x="818" y="122" text-anchor="middle" font-size="8.5" fill="#777">output data</text>

  <!-- Query Execution Layer -->
  <rect x="52" y="160" width="830" height="168" rx="12" fill="#F0E6D2" stroke="#D4C0A0" stroke-width="1.2"/>
  <text x="76" y="184" font-size="13" font-weight="700" fill="#7A6030" letter-spacing="0.2">Query Execution Layer</text>
  <text x="238" y="184" font-size="10" fill="#A07840">builds and runs a pull-based operator tree</text>

  <rect x="88" y="214" width="144" height="58" rx="8" fill="#fff" stroke="#D4C0A0" stroke-width="1"/>
  <text x="160" y="235" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A6030">Query Plan</text>
  <text x="160" y="251" text-anchor="middle" font-size="8.5" fill="#A89070">logical composition</text>
  <text x="160" y="263" text-anchor="middle" font-size="8.5" fill="#A89070">of operators</text>

  <rect x="290" y="206" width="266" height="74" rx="8" fill="#fff" stroke="#D4C0A0" stroke-width="1"/>
  <text x="423" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A6030">Operators</text>
  <text x="423" y="244" text-anchor="middle" font-size="8.5" fill="#A89070">Scan · Filter · Aggregate · GroupBy</text>
  <text x="423" y="257" text-anchor="middle" font-size="8.5" fill="#A89070">OrderByLimit</text>
  <text x="423" y="270" text-anchor="middle" font-size="8.5" fill="#A89070">common contract: Next() → Batch?</text>

  <rect x="614" y="214" width="104" height="58" rx="8" fill="#fff" stroke="#D4C0A0" stroke-width="1"/>
  <text x="666" y="236" text-anchor="middle" font-size="10" font-weight="600" fill="#7A6030">Expressions</text>
  <text x="666" y="252" text-anchor="middle" font-size="8.5" fill="#A89070">predicates</text>
  <text x="666" y="264" text-anchor="middle" font-size="8.5" fill="#A89070">keys</text>

  <rect x="746" y="214" width="104" height="58" rx="8" fill="#fff" stroke="#D4C0A0" stroke-width="1"/>
  <text x="798" y="236" text-anchor="middle" font-size="10" font-weight="600" fill="#7A6030">Aggregates</text>
  <text x="798" y="252" text-anchor="middle" font-size="8.5" fill="#A89070">functions</text>
  <text x="798" y="264" text-anchor="middle" font-size="8.5" fill="#A89070">states</text>

  <rect x="310" y="292" width="226" height="22" rx="6" fill="#fffaf0" stroke="#D4C0A0" stroke-width="0.9"/>
  <text x="423" y="307" text-anchor="middle" font-size="8.5" fill="#A89070">pull protocol: parent requests data from child</text>

  <!-- Clear in-layer arrows -->
  <line x1="180" y1="112" x2="232" y2="112" stroke="#2f2f2f" stroke-width="1.2"/>
  <path d="M232,112 L232,194 L160,194 L160,212" fill="none" stroke="#2f2f2f" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <line x1="232" y1="243" x2="288" y2="243" stroke="#A07840" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <line x1="556" y1="243" x2="612" y2="243" stroke="#A07840" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <line x1="718" y1="243" x2="744" y2="243" stroke="#A07840" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
  <path d="M556,243 L586,243 L586,112 L754,112" fill="none" stroke="#2f2f2f" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <line x1="423" y1="280" x2="423" y2="290" stroke="#A07840" stroke-width="1" marker-end="url(#arrow-amber)"/>

  <!-- Columnar Data Model Layer -->
  <rect x="52" y="364" width="830" height="126" rx="12" fill="#DAEAF5" stroke="#A8C8E0" stroke-width="1.2"/>
  <text x="76" y="388" font-size="13" font-weight="700" fill="#3A6A8A" letter-spacing="0.2">Columnar Data Model Layer</text>
  <text x="270" y="388" font-size="10" fill="#5A8AAA">in-memory representation</text>

  <rect x="92" y="424" width="142" height="42" rx="8" fill="#fff" stroke="#A8C8E0" stroke-width="1"/>
  <text x="163" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#3A6A8A">Types</text>
  <text x="163" y="457" text-anchor="middle" font-size="8.5" fill="#6A9AB8">primitive + date/time</text>

  <rect x="286" y="424" width="142" height="42" rx="8" fill="#fff" stroke="#A8C8E0" stroke-width="1"/>
  <text x="357" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#3A6A8A">Schema</text>
  <text x="357" y="457" text-anchor="middle" font-size="8.5" fill="#6A9AB8">names and types</text>

  <rect x="480" y="424" width="142" height="42" rx="8" fill="#fff" stroke="#A8C8E0" stroke-width="1"/>
  <text x="551" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#3A6A8A">Columns</text>
  <text x="551" y="457" text-anchor="middle" font-size="8.5" fill="#6A9AB8">typed vectors</text>

  <rect x="674" y="424" width="142" height="42" rx="8" fill="#fff" stroke="#A8C8E0" stroke-width="1"/>
  <text x="745" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#3A6A8A">Batch</text>
  <text x="745" y="457" text-anchor="middle" font-size="8.5" fill="#6A9AB8">schema + columns</text>

  <line x1="234" y1="445" x2="284" y2="445" stroke="#4A7FB5" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <path d="M357,424 L357,412 L640,412 L640,445" fill="none" stroke="#4A7FB5" stroke-width="1.2"/>
  <line x1="622" y1="445" x2="672" y2="445" stroke="#4A7FB5" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <path d="M163,466 L163,482 L551,482 L551,468" fill="none" stroke="#4A7FB5" stroke-width="1.2" marker-end="url(#arrow-blue)"/>

  <!-- Non-crossing layer relation: execution to data model -->
  <path d="M745,328 L745,422" fill="none" stroke="#2f2f2f" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <text x="758" y="350" font-size="8.5" fill="#777">operators pass batches</text>

  <!-- Storage Layer -->
  <rect x="52" y="526" width="830" height="92" rx="12" fill="#D8ECDD" stroke="#9CC5A6" stroke-width="1.2"/>
  <text x="76" y="550" font-size="13" font-weight="700" fill="#3A6E48" letter-spacing="0.2">Storage Layer</text>
  <text x="184" y="550" font-size="10" fill="#5A8F6A">reads and writes CSV/BZN files as columnar batches</text>

  <rect x="112" y="570" width="132" height="30" rx="8" fill="#fff" stroke="#9CC5A6" stroke-width="1"/>
  <text x="178" y="589" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3A6E48">CSVReader</text>

  <rect x="374" y="562" width="186" height="46" rx="8" fill="#fff" stroke="#9CC5A6" stroke-width="1"/>
  <text x="467" y="581" text-anchor="middle" font-size="10" font-weight="600" fill="#3A6E48">BZNReader / BZNWriter</text>
  <text x="467" y="595" text-anchor="middle" font-size="8.5" fill="#6A9F78">main columnar storage</text>

  <rect x="690" y="570" width="132" height="30" rx="8" fill="#fff" stroke="#9CC5A6" stroke-width="1"/>
  <text x="756" y="589" text-anchor="middle" font-size="9.5" font-weight="600" fill="#3A6E48">BZN file</text>

  <line x1="244" y1="585" x2="372" y2="585" stroke="#4F8A5E" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="560" y1="585" x2="688" y2="585" stroke="#4F8A5E" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- Non-crossing layer relation: storage to data model -->
  <path d="M467,562 L467,492" fill="none" stroke="#2f2f2f" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <text x="482" y="516" font-size="8.5" fill="#777">materializes columns</text>

</svg>
